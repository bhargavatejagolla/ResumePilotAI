name: generic
tone: balanced

summary:
  length: [45, 65]
  emphasize: [achievements, skills, impact]

section_order:
  - summary
  - skills
  - experience
  - projects
  - education
  - achievements
  - certifications

projects:
  bullets_per_project: 3
  bullet_length: [18, 28]
  action_verbs: [Built, Developed, Engineered, Designed, Implemented, Optimized, Created]
  emphasize_metrics: true

experience:
  bullets_per_experience: 4

achievements:
  prefer: [national, research, hackathon]
  max_shown: 3

skills:
  categories_order: [languages, ai_ml, backend, devops, databases]

special_rules:
  grand_champion_always_in_summary: true
  no_project_removal: true

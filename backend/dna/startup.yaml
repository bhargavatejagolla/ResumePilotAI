name: startup
tone: ownership_speed

summary:
  length: [40, 60]
  emphasize: [shipping_speed, ownership, breadth, product]

section_order:
  - summary
  - projects
  - skills
  - experience
  - education
  - achievements
  - certifications

projects:
  bullets_per_project: 4
  bullet_length: [16, 26]
  action_verbs: [Built, Shipped, Owned, Launched, Iterated, Scaled, Delivered]
  emphasize_metrics: true
  emphasize: [speed, impact, product, breadth]

experience:
  bullets_per_experience: 4

achievements:
  prefer: [national, hackathon]
  max_shown: 3

skills:
  categories_order: [languages, ai_ml, backend, devops, databases]

special_rules:
  grand_champion_always_in_summary: true
  no_project_removal: true

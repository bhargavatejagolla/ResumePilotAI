name: microsoft
tone: engineering_collaboration

summary:
  length: [45, 65]
  emphasize: [systems, reliability, collaboration, growth]

section_order:
  - summary
  - skills
  - experience
  - projects
  - education
  - achievements
  - certifications

projects:
  bullets_per_project: 4
  bullet_length: [18, 28]
  action_verbs: [Built, Collaborated, Architected, Shipped, Improved, Scaled, Designed]
  emphasize_metrics: true
  emphasize: [teamwork, cross_functional, reliability]

experience:
  bullets_per_experience: 5

achievements:
  prefer: [national, research]
  max_shown: 3

skills:
  categories_order: [languages, backend, ai_ml, devops, databases]

special_rules:
  grand_champion_always_in_summary: true
  no_project_removal: true
